<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netlify Deploy Test</title>
    <style>
        :root {
            --netlify-teal: #00ad9f;
            --netlify-dark: #20232a;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f7f6;
            color: var(--netlify-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            border-top: 5px solid var(--netlify-teal);
        }
        h1 { color: var(--netlify-teal); margin-bottom: 10px; }
        p { line-height: 1.6; color: #555; }
        .status-badge {
            display: inline-block;
            background: #e6fffa;
            color: #2c7a7b;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        button {
            background-color: var(--netlify-teal);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); background-color: #008e83; }
        #timestamp { margin-top: 15px; font-size: 0.8rem; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-badge">● Live on Netlify</div>
        <h1>🚀 Deploy Thành Công!</h1>
        <p>Chào bạn! Nếu bạn đang thấy trang web này, nghĩa là quá trình deploy của bạn đã hoạt động hoàn hảo.</p>
        <button onclick="testFunction()">Kiểm tra tương tác</button>
        <p id="message"></p>
        <div id="timestamp"></div>
    </div>

    <script>
        function testFunction() {
            const msg = document.getElementById('message');
            msg.innerText = "JavaScript cũng hoạt động mượt mà! 🎉";
            msg.style.color = "#00ad9f";
            msg.style.fontWeight = "bold";
        }
        // Hiển thị thời gian hiện tại
        document.getElementById('timestamp').innerText = "Thời gian tải trang: " + new Date().toLocaleString('vi-VN');
    </script>
</body>
</html>
